server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Agent bridge（Compose · DEC-044）· 须写在通用 /api/ 之前
  location /api/agent/ {
    proxy_pass http://agent-bridge:8091/api/agent/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  # YiAgent factory 筛选台 API（内网 factory:80）
  location /api/factory/ {
    proxy_pass http://factory:80/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location /api/ {
    proxy_pass http://projects-api:8090/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(html|js|css)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
}
