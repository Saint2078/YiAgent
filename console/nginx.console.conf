server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # 本机直跑：浏览器同源代理 Kimi（避开 CORS Failed to fetch）
  # Authorization 由前端带上用户 Key，nginx 原样转发
  location /api/llm/plan/ {
    proxy_pass https://api.kimi.com/coding/v1/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host api.kimi.com;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Connection "";
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    # 不缓存对话
    proxy_buffering off;
  }

  location /api/llm/open/ {
    proxy_pass https://api.moonshot.cn/v1/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host api.moonshot.cn;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Connection "";
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # console-only：不代理 factory / bridge（全栈见 docker-compose.yml + nginx.conf）
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(html|js|css)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
}
