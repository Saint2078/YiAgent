<!DOCTYPE html>
<html lang="zh-Hans" style="color-scheme: dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>YiAgent · Genome DNA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #071018;
      --panel: #0d1824;
      --ink: #edf3f7;
      --muted: #8aa0b2;
      --line: rgba(237, 243, 247, 0.12);
      --accent: #3ecfbe;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Instrument Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      overflow: hidden;
      color-scheme: dark;
    }
    body {
      background:
        radial-gradient(900px 520px at 20% 0%, rgba(62, 207, 190, 0.1), transparent 55%),
        radial-gradient(700px 480px at 90% 100%, rgba(245, 166, 35, 0.07), transparent 50%),
        #071018;
    }
    #stage { position: absolute; inset: 0; z-index: 1; display: block; }
    #labels { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
    #labels * { pointer-events: auto; }
    .hud { position: absolute; z-index: 20; pointer-events: none; }
    .hud * { pointer-events: auto; }

    .topbar {
      top: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; gap: 16px;
      align-items: flex-start;
    }
    .brand { max-width: 420px; }
    .brand-kicker {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .brand h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 3.2vw, 40px);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.25;
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Instrument Sans", sans-serif;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      max-width: 36ch;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(13, 24, 36, 0.88);
      color: var(--ink);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .chip.on, .chip:hover {
      border-color: rgba(62, 207, 190, 0.55);
      color: var(--accent);
    }

    /* 分区标签（螺旋右侧） */
    .zone-tag {
      position: absolute;
      transform: translateY(-50%);
      display: flex; align-items: center; gap: 8px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 7px 11px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      user-select: none;
      background: rgba(13, 24, 36, 0.72);
    }
    .zone-tag i {
      width: 8px; height: 8px; border-radius: 50%;
      flex: none;
    }
    .zone-tag.dim { opacity: 0.28; }
    .zone-tag.lit {
      background: rgba(13, 24, 36, 0.92);
    }

    /* 基因槽：三列铺满最终表达基因 */
    .allele-rack {
      position: absolute;
      transform: translateY(-50%);
      display: flex;
      gap: 8px;
      align-items: flex-start;
      transition: opacity 0.15s;
    }
    .allele-rack.dim { opacity: 0.28; }
    .allele-card {
      width: 236px;
      max-height: min(42vh, 320px);
      overflow-x: hidden;
      overflow-y: auto;
      padding: 4px 0;
      border-radius: 10px;
      background: rgba(13, 24, 36, 0.88);
      border: 1px solid var(--line);
      font-size: 12.5px;
      line-height: 1.45;
      user-select: none;
      font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", "Instrument Sans", sans-serif;
    }
    .allele-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      min-height: 28px;
      box-sizing: border-box;
    }
    .allele-row .dot {
      flex: none;
      font-size: 11px;
      line-height: 1;
    }
    .allele-row .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0;
    }
    .allele-row .tag {
      margin-left: auto;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.02em;
      color: var(--muted);
      flex: none;
      text-align: right;
      line-height: 1.25;
      white-space: nowrap;
    }
    .allele-row .tag .mu {
      color: var(--ink);
      font-weight: 600;
    }
    .allele-row .tag .sep {
      opacity: 0.45;
      margin: 0 3px;
    }
    .allele-row .tag .sd {
      color: var(--accent);
      font-weight: 500;
    }
    .allele-row.active { color: var(--ink); font-weight: 500; }
    .allele-row.active .tag { opacity: 1; }
    .allele-row.weak { color: var(--muted); }
    .allele-row.lit { background: rgba(13, 24, 36, 0.92); }
    .allele-row.slot-empty {
      cursor: default;
      border: 1px dashed rgba(237, 243, 247, 0.14);
      margin: 2px 6px;
      height: 28px;
      background: rgba(7, 16, 24, 0.28);
      color: transparent;
    }

    .panel {
      top: 118px; right: 20px;
      width: min(320px, calc(100vw - 40px));
      background: rgba(13, 24, 36, 0.94);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      display: none;
    }
    .panel.show { display: block; }
    .panel-type {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .panel h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
    .panel-meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; line-height: 1.4; }
    .panel-body {
      color: #d7e2ea;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      max-height: 28vh;
      overflow: auto;
    }
    .panel-score {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      margin-bottom: 4px;
    }
    .panel-score-title {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .panel-score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
    }
    .panel-score-item {
      background: rgba(7, 16, 24, 0.55);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
    }
    .panel-score-item .k {
      display: block;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .panel-score-item .v {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }
    .panel-score-note {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    .panel-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .panel-actions .chip.primary {
      background: rgba(62, 207, 190, 0.18);
      border-color: rgba(62, 207, 190, 0.55);
      color: var(--ink);
      text-decoration: none;
    }
    .panel-actions .chip.primary:hover {
      background: rgba(62, 207, 190, 0.28);
    }

    .legend {
      bottom: 18px; left: 20px;
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      padding: 10px 12px;
      background: rgba(13, 24, 36, 0.9);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted);
    }
    .legend b { color: var(--ink); font-weight: 500; }
    .legend i {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
    }
    .hint {
      bottom: 18px; right: 20px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted);
      background: rgba(13, 24, 36, 0.9);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .genome-pick {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      pointer-events: auto;
    }
    .genome-pick .chip.active {
      border-color: rgba(62, 207, 190, 0.65);
      background: rgba(62, 207, 190, 0.18);
      color: var(--ink);
    }
    .controls select#genome-select {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(13, 24, 36, 0.92);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      max-width: 220px;
    }
    html.embed .brand-kicker { display: none; }
    html.embed .brand h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.3;
      margin: 0;
    }
    html.embed .brand p { display: none; }
    html.embed .genome-pick { display: none !important; }
    html.embed #genome-select { display: none !important; }
    html.embed #case-perf { display: none; }
    html.embed .topbar { top: 10px; left: 12px; right: 12px; }
    html.embed .legend { bottom: 10px; left: 12px; }
    html.embed .hint { bottom: 10px; right: 12px; }
  </style>
</head>
<body>
  <script>
    if (new URLSearchParams(location.search).get("embed") === "1") {
      document.documentElement.classList.add("embed");
    }
  </script>
  <canvas id="stage"></canvas>
  <div id="labels"></div>

  <div class="hud topbar">
    <div class="brand">
      <div class="brand-kicker">YiAgent Genome · 多基因组</div>
      <h1 id="genome-title">Genome DNA</h1>
      <p id="genome-desc">G1–G5 等位嵌在螺旋链上 · 悬停查看基因详情</p>
      <div class="genome-pick" id="genome-pick" aria-label="选择基因组"></div>
      <div id="case-perf" style="margin-top:10px;font-family:JetBrains Mono,ui-monospace,monospace;font-size:11px;color:var(--muted);line-height:1.5"></div>
    </div>
    <div class="controls">
      <select id="genome-select" aria-label="基因组"></select>
      <button class="chip" type="button" id="btn-spin">旋转 · 关</button>
      <button class="chip" type="button" id="btn-particles">粒子 · 关</button>
      <button class="chip" type="button" id="btn-fit">适配</button>
    </div>
  </div>

  <aside class="hud panel" id="detail">
    <div class="panel-type" id="d-type">NODE</div>
    <h2 id="d-title">—</h2>
    <div class="panel-meta" id="d-meta"></div>
    <div class="panel-score" id="d-score" hidden></div>
    <div class="panel-body" id="d-body"></div>
    <div class="panel-actions" id="d-actions" hidden></div>
  </aside>

  <div class="hud legend">
    <span><i style="background:#5ec8ff"></i><b>G1</b> 身份</span>
    <span><i style="background:#3ecfbe"></i><b>G2</b> 人设</span>
    <span><i style="background:#9fd356"></i><b>G3</b> 知识</span>
    <span><i style="background:#f5a623"></i><b>G4</b> 落地</span>
    <span><i style="background:#ff6b8a"></i><b>G5</b> 经验</span>
  </div>
  <div class="hud hint">拖拽平移 · 滚轮缩放 · 悬停查看</div>

  <script src="genome-packs.js?v=20260806-type"></script>
  <script src="genome-packs-factory-v11.js?v=20260810-v11b"></script>
  <script>
    const SLOTS = ["G1", "G2", "G3", "G4", "G5"];
    const SLOT_META = {
      G1: { label: "身份", note: "我是谁、对外怎么自报" },
      G2: { label: "人设边界", note: "能定什么 / 绝不能定什么" },
      G3: { label: "知识", note: "长期挂载的已认证材料" },
      G4: { label: "落地策略", note: "怎么规划与执行现场交付" },
      G5: { label: "经验策略", note: "失败/成功蒸馏的控制信号" },
    };
    const SLOT_COLORS = {
      G1: "#5ec8ff",
      G2: "#3ecfbe",
      G3: "#9fd356",
      G4: "#f5a623",
      G5: "#ff6b8a",
    };

    const PACKS = window.YIAGENT_GENOME_PACKS || {};
    let ALLELES = { G1: [], G2: [], G3: [], G4: [], G5: [] };
    let GENOME = { id: "", title: "", note: "", short: "", casePerf: "" };
    let GENE_BEADS = [];

    function applyGenome(id, opts = {}) {
      const pack = PACKS[id] || PACKS.ai_architect || Object.values(PACKS)[0];
      if (!pack) return;
      GENOME = {
        id: pack.id,
        title: pack.title,
        short: pack.short || pack.title,
        note: pack.note || "",
        casePerf: pack.casePerf || "",
      };
      ALLELES = pack.alleles;
      GENE_BEADS = geneBeads();
      const titleEl = document.getElementById("genome-title");
      const descEl = document.getElementById("genome-desc");
      const perfEl = document.getElementById("case-perf");
      if (titleEl) titleEl.textContent = GENOME.short;
      if (descEl) descEl.textContent = GENOME.note;
      if (perfEl) {
        perfEl.innerHTML =
          (GENOME.casePerf ? escHtml(GENOME.casePerf) + " · " : "") +
          `<a href="/" target="_top" style="color:var(--accent)">打开单基因工作台</a>`;
      }
      document.title = "YiAgent · " + GENOME.short;
      syncGenomeControls(pack.id);
      if (typeof buildLabels === "function") buildLabels();
      if (typeof layoutLabels === "function") layoutLabels();
      if (!opts.skipUrl) {
        const u = new URL(location.href);
        u.searchParams.set("genome", pack.id);
        history.replaceState(null, "", u);
      }
      if (typeof clearFocus === "function") clearFocus();
    }

    function hashStr(s) {
      let h = 2166136261;
      const str = String(s || "");
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    /** 单体得分：优先读字段，否则按 id 稳定伪造（展示用） */
    function geneStats(al) {
      const h = hashStr(al?.id || al?.label || "gene");
      let mean = Number(al?.mean);
      let sdv = Number(al?.sdv);
      if (!Number.isFinite(mean)) mean = Math.round((72 + (h % 2300) / 100) * 10) / 10;
      if (!Number.isFinite(sdv)) sdv = Math.round((0.4 + ((h >>> 8) % 360) / 100) * 100) / 100;
      const n = Number.isFinite(Number(al?.n)) ? Number(al.n) : 3 + (h % 5);
      const min = Number.isFinite(Number(al?.min))
        ? Number(al.min)
        : Math.round((mean - sdv * (1.2 + (h % 50) / 100)) * 10) / 10;
      const max = Number.isFinite(Number(al?.max))
        ? Number(al.max)
        : Math.round((mean + sdv * (1.0 + ((h >>> 4) % 40) / 100)) * 10) / 10;
      const composite = Number.isFinite(Number(al?.composite))
        ? Number(al.composite)
        : Math.round((mean - sdv * 0.85) * 10) / 10;
      const reps = Number.isFinite(Number(al?.reps)) ? Number(al.reps) : n;
      return { mean, sdv, n, min, max, composite, reps };
    }

    function formatGeneStatTag(al) {
      const { mean, sdv } = geneStats(al);
      return `<span class="tag" title="单体 mean / sdv（展示用）"><span class="mu">${mean.toFixed(1)}</span><span class="sep">·</span><span class="sd">${sdv.toFixed(2)}</span></span>`;
    }

    function scoreDetailHtml(al, slot) {
      const st = geneStats(al);
      const geneQ = encodeURIComponent(al?.id || "");
      const slotQ = encodeURIComponent(slot || "");
      const packQ = encodeURIComponent(GENOME.id || "");
      return {
        meta: `${slot} ${SLOT_META[slot]?.label || ""} · mean ${st.mean.toFixed(1)} · sdv ${st.sdv.toFixed(2)}`,
        score: `
          <div class="panel-score-title">得分详情</div>
          <div class="panel-score-grid">
            <div class="panel-score-item"><span class="k">mean</span><span class="v">${st.mean.toFixed(1)}</span></div>
            <div class="panel-score-item"><span class="k">sdv</span><span class="v">${st.sdv.toFixed(2)}</span></div>
            <div class="panel-score-item"><span class="k">min</span><span class="v">${st.min.toFixed(1)}</span></div>
            <div class="panel-score-item"><span class="k">max</span><span class="v">${st.max.toFixed(1)}</span></div>
            <div class="panel-score-item"><span class="k">composite</span><span class="v">${st.composite.toFixed(1)}</span></div>
            <div class="panel-score-item"><span class="k">n / reps</span><span class="v">${st.n} / ${st.reps}</span></div>
          </div>
          <div class="panel-score-note">展示用伪造分 · 同源 id 稳定；正式分以后接单基因筛选实跑。</div>`,
        actions: `
          <a class="chip primary" href="/?page=chat&gene=${geneQ}&slot=${slotQ}&genome=${packQ}" target="_top" rel="noopener">编辑 · 单基因工作台</a>`,
      };
    }

    function escHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function syncGenomeControls(activeId) {
      const pick = document.getElementById("genome-pick");
      const sel = document.getElementById("genome-select");
      if (pick) {
        pick.innerHTML = Object.values(PACKS)
          .map(
            (p) =>
              `<button class="chip ${p.id === activeId ? "active" : ""}" type="button" data-genome="${p.id}">${escHtml(
                p.short || p.id
              )}</button>`
          )
          .join("");
      }
      if (sel && !sel.dataset.bound) {
        sel.innerHTML = Object.values(PACKS)
          .map((p) => `<option value="${p.id}">${escHtml(p.title)}</option>`)
          .join("");
        sel.addEventListener("change", () => applyGenome(sel.value));
        sel.dataset.bound = "1";
      }
      if (sel) sel.value = activeId;
    }

    // placeholders filled after helpers exist
    function geneBeads() {
      const beads = [];
      SLOTS.forEach((slot, zi) => {
        const list = ALLELES[slot] || [];
        const t0 = zi / 5;
        const t1 = (zi + 1) / 5;
        list.forEach((al, j) => {
          const u = (j + 1) / (list.length + 1);
          const t = t0 + u * (t1 - t0);
          const strand = j % 2; // 仅视觉分链；全部为最终表达基因
          beads.push({ allele: al, slot, t, strand });
        });
      });
      return beads;
    }

    /** 三列铺满最终表达基因；行数随数量动态，避免截断 */
    const SLOT_COLS = 3;
    const CARD_W = 220;
    const RACK_GAP = 8;
    const RACK_W = SLOT_COLS * CARD_W + (SLOT_COLS - 1) * RACK_GAP;

    function partitionAlleleColumns(slot) {
      const list = (ALLELES[slot] || []).filter((a) => a && a.active !== false);
      const cols = [[], [], []];
      if (!list.length) return cols;
      const perCol = Math.max(1, Math.ceil(list.length / SLOT_COLS));
      list.forEach((al, i) => {
        const c = Math.min(SLOT_COLS - 1, Math.floor(i / perCol));
        cols[c].push(al);
      });
      return cols;
    }

    // ---------- 工具 ----------
    function hexRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function rgba(hex, a) {
      const [r, g, b] = hexRgb(hex);
      return `rgba(${r},${g},${b},${a})`;
    }
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const zoneOf = (t) => SLOTS[clamp(Math.floor(t * 5), 0, 4)];

    // ---------- 画布与视图 ----------
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const labelLayer = document.getElementById("labels");

    const view = { zoom: 1, panX: 0, panY: 0 };
    const base = { w: 0, h: 0, cx: 0, cy: 0, R: 100, yTop: 0, yBot: 0, H: 0 };

    const HELIX = { turns: 2.1, samples: 150, rungEvery: 6 };
    let phase = 0;
    let spinning = false;
    let particlesOn = false;

    const isEmbed = document.documentElement.classList.contains("embed");

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      base.w = window.innerWidth;
      base.h = window.innerHeight;
      canvas.width = base.w * dpr;
      canvas.height = base.h * dpr;
      canvas.style.width = base.w + "px";
      canvas.style.height = base.h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      base.R = clamp(base.w * 0.09, 72, 130);
      // 螺旋略偏左（再往右挪一点），右侧留给 G 标签 + 贴右基因槽
      base.cx = base.R * 1.45 + 72;
      // 竖直拉满：螺旋占满可用高度（顶栏留给 HUD，底留给图例）
      base.yTop = base.h * (isEmbed ? 0.08 : 0.12);
      base.yBot = base.h * (isEmbed ? 0.96 : 0.93);
      base.cy = (base.yTop + base.yBot) / 2;
      base.H = base.yBot - base.yTop;
      layoutLabels();
    }
    window.addEventListener("resize", resize);

    // t∈[0,1]，phaseOff：0/π 两条链（视觉）；基因均为最终表达
    function helixPoint(t, phaseOff) {
      const ang = t * HELIX.turns * Math.PI * 2 + phase + phaseOff;
      const wx = base.R * Math.cos(ang);
      const wy = base.yTop + t * base.H;
      return {
        x: base.cx + view.panX + wx * view.zoom,
        y: base.cy + view.panY + (wy - base.cy) * view.zoom,
        z: Math.sin(ang),
      };
    }
    function midY(i) {
      const t = (i + 0.5) / 5;
      return base.cy + view.panY + (base.yTop + t * base.H - base.cy) * view.zoom;
    }

    // ---------- 螺旋靠左 · G1–G5 · 贴右三列同形异内容基因槽 ----------
    const zoneTags = [];
    const alleleRacks = [];
    function buildAlleleListCard(slot, color, alleles) {
      const card = document.createElement("div");
      card.className = "allele-card";
      const list = alleles || [];
      if (!list.length) {
        const row = document.createElement("div");
        row.className = "allele-row slot-empty";
        row.setAttribute("aria-label", `${slot} 空槽`);
        card.appendChild(row);
        return card;
      }
      list.forEach((al) => {
        const row = document.createElement("div");
        row.className = "allele-row active";
        row._allele = al;
        row.innerHTML = `<span class="dot" style="color:${color}">●</span><span class="name">${al.label}</span>${formatGeneStatTag(al)}`;
        row.addEventListener("mouseenter", () => setFocus({ kind: "allele", slot, allele: al }));
        row.addEventListener("mouseleave", clearFocus);
        row.addEventListener("click", (e) => {
          e.stopPropagation();
          pinFocus({ kind: "allele", slot, allele: al });
        });
        card.appendChild(row);
      });
      return card;
    }
    function buildLabels() {
      labelLayer.innerHTML = "";
      zoneTags.length = 0;
      alleleRacks.length = 0;
      SLOTS.forEach((slot) => {
        const color = SLOT_COLORS[slot];
        const tag = document.createElement("div");
        tag.className = "zone-tag";
        tag.style.color = color;
        tag.style.borderColor = "transparent";
        tag.innerHTML = `<i style="background:${color}"></i><b>${slot}</b>&nbsp;${SLOT_META[slot].label}`;
        tag.addEventListener("mouseenter", () => setFocus({ kind: "zone", slot }));
        tag.addEventListener("mouseleave", clearFocus);
        tag.addEventListener("click", () => pinFocus({ kind: "zone", slot }));
        labelLayer.appendChild(tag);
        zoneTags.push(tag);

        const rack = document.createElement("div");
        rack.className = "allele-rack";
        const cols = partitionAlleleColumns(slot);
        for (let c = 0; c < SLOT_COLS; c++) {
          rack.appendChild(buildAlleleListCard(slot, color, cols[c] || []));
        }
        labelLayer.appendChild(rack);
        alleleRacks.push(rack);
      });
    }

    function layoutLabels() {
      const R = base.R * view.zoom;
      const helixRight = base.cx + view.panX + R;
      const rackRightPad = 14;
      const rackLeft = Math.max(8, base.w - RACK_W - rackRightPad);
      // G1–G5 放在螺旋与基因槽正中间
      const midGap = (helixRight + rackLeft) / 2;

      alleleRacks.forEach((rack, i) => {
        rack.style.left = rackLeft + "px";
        rack.style.top = midY(i) + "px";
      });

      zoneTags.forEach((tag, i) => {
        const tagW = tag.offsetWidth || 120;
        let tagLeft = midGap - tagW / 2;
        // 不压螺旋、不压基因槽
        tagLeft = Math.max(helixRight + 12, tagLeft);
        tagLeft = Math.min(rackLeft - tagW - 12, tagLeft);
        tag.style.left = Math.max(8, tagLeft) + "px";
        tag.style.top = midY(i) + "px";
      });
    }

    // ---------- 焦点 / 详情面板 ----------
    const detail = document.getElementById("detail");
    const dScore = document.getElementById("d-score");
    const dActions = document.getElementById("d-actions");
    let focus = null;   // {kind:'zone'|'allele', slot, allele?}
    let pinned = null;
    let panelHold = false;

    function currentFocus() { return focus || pinned; }

    function setFocus(f) {
      focus = f;
      render();
    }
    function clearFocus() {
      if (panelHold) return;
      focus = null;
      render();
    }
    function pinFocus(f) {
      pinned = pinned && pinned.kind === f.kind && pinned.slot === f.slot &&
               pinned.allele === f.allele ? null : f;
      render();
    }

    detail.addEventListener("mouseenter", () => {
      panelHold = true;
    });
    detail.addEventListener("mouseleave", () => {
      panelHold = false;
      if (!pinned) clearFocus();
    });

    function render() {
      const f = currentFocus();
      zoneTags.forEach((tag, i) => {
        const slot = SLOTS[i];
        const lit = f && f.slot === slot;
        tag.classList.toggle("dim", !!f && !lit);
        tag.classList.toggle("lit", !!lit);
        tag.style.borderColor = lit ? rgba(SLOT_COLORS[slot], 0.55) : "transparent";
      });
      alleleRacks.forEach((rack, i) => {
        const slot = SLOTS[i];
        const lit = f && f.slot === slot;
        rack.classList.toggle("dim", !!f && !lit);
        rack.querySelectorAll(".allele-row:not(.slot-empty)").forEach((row) => {
          const al = row._allele;
          const rowLit = f && f.kind === "allele" && f.slot === slot && f.allele === al;
          row.classList.toggle("lit", !!rowLit);
          row.style.borderColor = rowLit ? rgba(SLOT_COLORS[slot], 0.45) : "transparent";
        });
      });
      if (!f) {
        detail.classList.remove("show");
        return;
      }
      if (f.kind === "zone") {
        const slot = f.slot;
        const list = (ALLELES[slot] || []).filter((a) => a && a.active !== false);
        document.getElementById("d-type").textContent = "分区 · " + list.length + " 个基因";
        document.getElementById("d-title").textContent = `${slot}  ${SLOT_META[slot].label}`;
        document.getElementById("d-meta").textContent = SLOT_META[slot].note + " · " + GENOME.title + " · 最终表达";
        dScore.hidden = true;
        dScore.innerHTML = "";
        dActions.hidden = true;
        dActions.innerHTML = "";
        document.getElementById("d-body").textContent = list
          .map((a) => {
            const st = geneStats(a);
            return `● ${a.label}  ·  mean ${st.mean.toFixed(1)}  sdv ${st.sdv.toFixed(2)}\n  ${a.text}`;
          })
          .join("\n\n");
      } else {
        const view = scoreDetailHtml(f.allele, f.slot);
        document.getElementById("d-type").textContent = "最终表达基因";
        document.getElementById("d-title").textContent = f.allele.label;
        document.getElementById("d-meta").textContent = view.meta;
        dScore.hidden = false;
        dScore.innerHTML = view.score;
        dActions.hidden = false;
        dActions.innerHTML = view.actions;
        document.getElementById("d-body").textContent = f.allele.text;
      }
      detail.classList.add("show");
    }

    // geneBeads() defined with genome pack loader above
    // ---------- 粒子（沿链流动的小点，数量随基因增多） ----------
    const particles = [];
    for (let i = 0; i < 42; i++) {
      particles.push({
        t: Math.random(),
        strand: i % 2,
        speed: 0.018 + Math.random() * 0.04,
        size: 1.3 + Math.random() * 1.5,
      });
    }

    // ---------- 绘制 ----------
    function draw(ts) {
      ctx.clearRect(0, 0, base.w, base.h);
      const f = currentFocus();
      const R = base.R * view.zoom;

      // 分区底色带
      for (let i = 0; i < 5; i++) {
        const slot = SLOTS[i];
        const y0 = base.cy + view.panY + (base.yTop + (i / 5) * base.H - base.cy) * view.zoom;
        const y1 = base.cy + view.panY + (base.yTop + ((i + 1) / 5) * base.H - base.cy) * view.zoom;
        const lit = f && f.slot === slot;
        const a = f ? (lit ? 0.09 : 0.015) : 0.045;
        ctx.fillStyle = rgba(SLOT_COLORS[slot], a);
        ctx.fillRect(base.cx + view.panX - R * 1.28, y0, R * 2.56, y1 - y0);
      }

      // 连线：螺旋 → G 标签 → 基因槽文字
      ctx.lineWidth = 1;
      zoneTags.forEach((tag, i) => {
        const slot = SLOTS[i];
        const lit = f && f.slot === slot;
        const a = f ? (lit ? 0.7 : 0.08) : 0.3;
        const y = midY(i);
        const tagLeft = parseFloat(tag.style.left) || 0;
        ctx.strokeStyle = rgba(SLOT_COLORS[slot], a);
        ctx.beginPath();
        ctx.moveTo(base.cx + view.panX + R * 1.05, y);
        ctx.lineTo(tagLeft - 6, y);
        ctx.stroke();
      });
      alleleRacks.forEach((rack, i) => {
        const slot = SLOTS[i];
        const lit = f && f.slot === slot;
        const a = f ? (lit ? 0.55 : 0.06) : 0.22;
        const y = midY(i);
        const tag = zoneTags[i];
        const tagRight = (parseFloat(tag.style.left) || 0) + tag.offsetWidth;
        const rackLeft = parseFloat(rack.style.left) || 0;
        ctx.strokeStyle = rgba(SLOT_COLORS[slot], a);
        ctx.beginPath();
        ctx.moveTo(tagRight + 4, y);
        ctx.lineTo(rackLeft - 6, y);
        ctx.stroke();
      });

      // 采样点
      const N = HELIX.samples;
      const ptsA = [];
      const ptsB = [];
      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        ptsA.push({ ...helixPoint(t, 0), t });
        ptsB.push({ ...helixPoint(t, Math.PI), t });
      }

      const dim = (slot) => (f && f.slot !== slot ? 0.22 : 1);

      // 碱基对横档（先画远景一半）
      const drawRung = (i) => {
        const a = ptsA[i];
        const b = ptsB[i];
        const slot = zoneOf(a.t);
        const depth = (a.z + b.z) / 2; // -1 远 → 1 近
        const zoneMidT = (SLOTS.indexOf(slot) + 0.5) / 5;
        const isExpress = Math.abs(a.t - zoneMidT) < (1 / 5) / 8;
        let alpha = (0.22 + 0.5 * (depth + 1) / 2) * dim(slot);
        let width = (depth > 0 ? 2.2 : 1.2) * view.zoom;
        if (isExpress) {
          const pulse = 0.75 + 0.25 * Math.sin(ts * 2.6 + SLOTS.indexOf(slot));
          alpha = Math.min(1, (alpha + 0.35) * pulse);
          width += 0.9;
          ctx.shadowColor = SLOT_COLORS[slot];
          ctx.shadowBlur = 10 * pulse;
        }
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.strokeStyle = rgba(SLOT_COLORS[slot], alpha);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mx, my); ctx.stroke();
        ctx.strokeStyle = `rgba(127,147,165,${alpha * 0.8})`;
        ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.shadowBlur = 0;
        // 碱基对中心点
        ctx.fillStyle = rgba(SLOT_COLORS[slot], Math.min(1, alpha + 0.25));
        ctx.beginPath(); ctx.arc(mx, my, 1.8 * view.zoom, 0, Math.PI * 2); ctx.fill();
      };
      for (let i = 0; i < N; i += HELIX.rungEvery) {
        if ((ptsA[i].z + ptsB[i].z) / 2 <= 0) drawRung(i);
      }
      for (let i = 0; i < N; i += HELIX.rungEvery) {
        if ((ptsA[i].z + ptsB[i].z) / 2 > 0) drawRung(i);
      }

      // 链珠（按深度排序，远的先画）
      const beads = [];
      for (let i = 0; i < N; i++) {
        beads.push({ p: ptsA[i], strand: 0 });
        beads.push({ p: ptsB[i], strand: 1 });
      }
      beads.sort((u, v) => u.p.z - v.p.z);
      for (const { p, strand } of beads) {
        const slot = zoneOf(p.t);
        const near = (p.z + 1) / 2;
        const r = (1.6 + 2.0 * near) * view.zoom;
        const alpha = (0.3 + 0.7 * near) * dim(slot);
        if (strand === 0) {
          ctx.fillStyle = rgba(SLOT_COLORS[slot], alpha);
          if (near > 0.82) {
            ctx.shadowColor = SLOT_COLORS[slot];
            ctx.shadowBlur = 7;
          }
        } else {
          ctx.fillStyle = `rgba(127,147,165,${alpha * 0.85})`;
        }
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }

      // 基因珠：等位直接画在螺旋链上（比骨架珠更大，可悬停）
      const geneDraw = GENE_BEADS.map((g) => {
        const p = helixPoint(g.t, g.strand * Math.PI);
        return { ...g, p };
      }).sort((a, b) => a.p.z - b.p.z);

      for (const g of geneDraw) {
        const { p, allele, slot, strand } = g;
        const near = (p.z + 1) / 2;
        const lit =
          f &&
          ((f.kind === "allele" && f.allele === allele) ||
            (f.kind === "zone" && f.slot === slot));
        const alpha = (0.45 + 0.55 * near) * dim(slot) * (f && !lit ? 0.35 : 1);
        const pulse = allele.active ? 0.85 + 0.15 * Math.sin(ts * 2.4 + g.t * 10) : 1;
        const r = (allele.active ? 5.2 : 4.0) * view.zoom * pulse * (0.75 + 0.35 * near);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        if (strand === 0) {
          ctx.fillStyle = rgba(SLOT_COLORS[slot], alpha);
          ctx.shadowColor = SLOT_COLORS[slot];
          ctx.shadowBlur = lit ? 16 : 8;
        } else {
          ctx.fillStyle = `rgba(148,163,184,${alpha * 0.9})`;
          ctx.shadowBlur = lit ? 10 : 0;
        }
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = (lit ? 2 : 1) * view.zoom;
        ctx.strokeStyle = lit ? "#edf3f7" : "rgba(237,243,247,0.35)";
        ctx.stroke();

        // 珠旁基因名：旋转时近侧/聚焦/表达等位持续显示
        const showLabel =
          allele.active ||
          lit ||
          (near > 0.12 && (!f || lit));
        if (showLabel && view.zoom > 0.55) {
          const label = allele.label;
          const fontSize = Math.max(11, (allele.active ? 12.5 : 11.5) * view.zoom);
          ctx.font = `${allele.active || lit ? 600 : 500} ${fontSize}px Instrument Sans, sans-serif`;
          const la = (allele.active || lit ? 0.95 : 0.45 + 0.5 * near) * (f && !lit ? 0.35 : 1);
          ctx.fillStyle = lit || allele.active
            ? `rgba(237,243,247,${la})`
            : `rgba(237,243,247,${0.4 + 0.35 * near})`;
          // 螺旋在左：字画在珠右侧，避免出屏
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(label, p.x + r + 8, p.y);
        }
      }

      // 粒子沿链流动
      if (particlesOn) {
        for (const pt of particles) {
          const p = pt.strand === 0 ? helixPoint(pt.t, 0) : helixPoint(pt.t, Math.PI);
          const slot = zoneOf(pt.t);
          const near = (p.z + 1) / 2;
          const alpha = (0.25 + 0.75 * near) * dim(slot);
          const color = pt.strand === 0 ? SLOT_COLORS[slot] : "#9db2c2";
          ctx.fillStyle = pt.strand === 0 ? rgba(color, alpha) : `rgba(157,178,194,${alpha * 0.8})`;
          ctx.shadowColor = color;
          ctx.shadowBlur = pt.strand === 0 ? 8 : 3;
          ctx.beginPath();
          ctx.arc(p.x, p.y, pt.size * view.zoom * (0.7 + 0.5 * near), 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
    }

    // ---------- 交互：缩放 / 平移 / 悬停 ----------
    let dragging = false;
    let dragMoved = false;
    let lastX = 0;
    let lastY = 0;

    canvas.addEventListener("mousedown", (e) => {
      dragging = true;
      dragMoved = false;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    window.addEventListener("mouseup", () => { dragging = false; });
    window.addEventListener("mousemove", (e) => {
      if (dragging) {
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
        view.panX += dx;
        view.panY += dy;
        lastX = e.clientX;
        lastY = e.clientY;
        layoutLabels();
        return;
      }
      if (e.target !== canvas) return;
      // 优先命中基因珠
      let hit = null;
      let best = 28;
      for (const g of GENE_BEADS) {
        const p = helixPoint(g.t, g.strand * Math.PI);
        const d = Math.hypot(e.clientX - p.x, e.clientY - p.y);
        const thresh = (g.allele.active ? 16 : 13) * view.zoom;
        if (d < thresh && d < best) {
          best = d;
          hit = g;
        }
      }
      if (hit) {
        if (!focus || focus.kind !== "allele" || focus.allele !== hit.allele) {
          setFocus({ kind: "allele", slot: hit.slot, allele: hit.allele });
        }
        canvas.style.cursor = "pointer";
        return;
      }
      const t = ((e.clientY - view.panY - base.cy) / view.zoom + base.cy - base.yTop) / base.H;
      const nearHelix = Math.abs(e.clientX - base.cx - view.panX) < base.R * view.zoom * 1.35;
      if (nearHelix && t >= 0 && t <= 1) {
        const slot = zoneOf(t);
        if (!focus || focus.kind !== "zone" || focus.slot !== slot) {
          setFocus({ kind: "zone", slot });
        }
        canvas.style.cursor = "pointer";
      } else {
        if (focus) clearFocus();
        canvas.style.cursor = "default";
      }
    });
    canvas.addEventListener("click", () => {
      if (dragMoved) return;
      if (focus) {
        pinFocus(focus);
      } else {
        pinned = null;
        render();
      }
    });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      view.zoom = clamp(view.zoom * Math.exp(-e.deltaY * 0.001), 0.55, 2.6);
      layoutLabels();
    }, { passive: false });

    function fit() {
      view.zoom = 1;
      view.panX = 0;
      view.panY = 0;
      layoutLabels();
      kick();
    }
    document.getElementById("btn-fit").onclick = fit;
    document.getElementById("btn-spin").onclick = function () {
      spinning = !spinning;
      this.classList.toggle("on", spinning);
      this.textContent = spinning ? "旋转 · 开" : "旋转 · 关";
      kick();
    };
    document.getElementById("btn-particles").onclick = function () {
      particlesOn = !particlesOn;
      this.classList.toggle("on", particlesOn);
      this.textContent = particlesOn ? "粒子 · 开" : "粒子 · 关";
      kick();
    };

    // ---------- 主循环：默认静止；仅旋转/粒子开或有交互时才跑帧 ----------
    let last = performance.now();
    let rafId = 0;
    let needsPaint = true;
    function kick() {
      needsPaint = true;
      if (!rafId) rafId = requestAnimationFrame(tick);
    }
    function tick(now) {
      rafId = 0;
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const animating = spinning || particlesOn;
      if (spinning) phase += dt * 0.55;
      if (particlesOn) {
        for (const pt of particles) {
          pt.t += pt.speed * dt;
          if (pt.t > 1) pt.t -= 1;
        }
      }
      if (needsPaint || animating) {
        needsPaint = false;
        draw(now / 1000);
      }
      if (animating) rafId = requestAnimationFrame(tick);
    }

    // 交互时补一帧
    const _layoutLabels = layoutLabels;
    layoutLabels = function () {
      _layoutLabels();
      kick();
    };
    const _setFocus = setFocus;
    setFocus = function (f) {
      _setFocus(f);
      kick();
    };
    const _clearFocus = clearFocus;
    clearFocus = function () {
      _clearFocus();
      kick();
    };
    const _pinFocus = pinFocus;
    pinFocus = function (f) {
      _pinFocus(f);
      kick();
    };

    const qGenome = new URLSearchParams(location.search).get("genome");
    const bootId =
      (qGenome && PACKS[qGenome] && qGenome) ||
      (PACKS.ai_architect && "ai_architect") ||
      Object.keys(PACKS)[0];
    applyGenome(bootId, { skipUrl: !qGenome });
    document.getElementById("genome-pick")?.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-genome]");
      if (!btn) return;
      applyGenome(btn.getAttribute("data-genome"));
      kick();
    });
    resize();
    kick();
  </script>
</body>
</html>
