services:
  factory:
    build:
      context: ..
      dockerfile: factory/Dockerfile
    ports:
      - "8787:80"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - YIAGENT_CASE_ROOT=/app/case/xsct
      - PYTHONPATH=/app/src
      # Hall of Fame ship: opt-in, pass through from shell env
      - YIAGENT_HOF_ENABLED
      - YIAGENT_HOF_URL
    volumes:
      - ./fixtures:/app/fixtures
      - ./save:/app/save
      - ./www:/app/www
      - ./server:/app/server
      - ../case:/app/case
      - ../src:/app/src
