[project]
name = "yiagent"
version = "0.2.0"
description = "Gene engineering for agent engineering — G1–G5 slots, scoring & promotion gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-TBD" }
dependencies = [
  "textual>=0.80.0",
]

[project.scripts]
yiagent = "yiagent.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yiagent = ["genome/data/*.json", "genome/data/skills/*.json"]
